# Google Cloud Build → Cloud Run.
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_SERVICE=eleicoes2026,_REGION=southamerica-east1
# Ajuste _SERVICE/_REGION ao serviço que já está em produção. A senha (APP_PASSWORD) fica no Secret Manager.
substitutions:
  _SERVICE: eleicoes2026
  _REGION: southamerica-east1
  _REPO: eleicoes
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --allow-unauthenticated
      # Streamlit usa websocket: sessão presa à mesma instância e conexão longa
      - --session-affinity
      - --timeout=3600
      # Domingo: sem "cold start" e sem CPU estrangulada entre requisições (o painel atualiza sozinho)
      - --min-instances=1
      - --max-instances=10
      - --no-cpu-throttling
      - --cpu=2
      - --memory=2Gi
      - --concurrency=80
      - --set-env-vars=TSE_AMBIENTE=oficial
